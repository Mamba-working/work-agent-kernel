<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="706" viewBox="0 0 1140 706">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#586775"/>
    </marker>
    <style>
      text {font-family:"PingFang SC","Hiragino Sans GB",sans-serif;fill:#202d3b}
      .title {font-size:36px;font-weight:650}.sub {font-size:19px;fill:#516071}
      .name {font-size:23px;font-weight:600}.label {font-size:15px;font-weight:600}
      .body {font-size:17px}.arrow {fill:none;stroke:#586775;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1140" height="706" fill="#fff"/>
  <text x="38" y="58" class="title">下一步要用这次回复吗？</text>
  <text x="39" y="95" class="sub">业务 Hook 回答这个问题，框架负责保存进度、继续或中断。</text>
  <rect x="38" y="128" width="1064" height="181" rx="16" fill="#f1f5fb"/>
  <text x="59" y="163" class="name">只需告知本人</text>
  <text x="59" y="198" class="body">成果已经保存</text>
  <rect x="258" y="161" width="210" height="67" rx="10" fill="#e1eaf8"/>
  <text x="277" y="188" class="name">continue</text><text x="278" y="214" class="body">登记一条后台通知</text>
  <path d="M478 194 H587" class="arrow"/>
  <text x="610" y="202" class="name">主流程继续</text>
  <path d="M366 234 V265 H587" stroke-dasharray="4 4" class="arrow"/>
  <text x="610" y="273" class="body">后台发送飞书通知，投递失败可重试</text>
  <rect x="38" y="329" width="1064" height="255" rx="16" fill="#fbf6ec"/>
  <text x="59" y="368" class="name">需要本人决定</text>
  <text x="59" y="402" class="body">未绑定群来信</text>
  <rect x="258" y="365" width="210" height="74" rx="10" fill="#f5e7c8"/>
  <text x="277" y="397" class="name">wait</text><text x="278" y="424" class="body">只暂停这一条</text>
  <path d="M478 400 H587" class="arrow"/>
  <text x="610" y="391" class="name">保存断点，后台发卡</text>
  <text x="610" y="424" class="body">卡片送达后仍等待本人提交</text>
  <path d="M717 440 V461 H547 V483" class="arrow"/>
  <path d="M717 440 V461 H946 V483" class="arrow"/>
  <rect x="403" y="490" width="290" height="72" rx="10" fill="#e1eaf8"/>
  <text x="425" y="520" class="name">同意 → continue</text><text x="425" y="547" class="body">可带上资料，接着走下一步</text>
  <rect x="801" y="490" width="275" height="72" rx="10" fill="#f5e1dc"/>
  <text x="823" y="520" class="name">拒绝 → break</text><text x="823" y="547" class="body">保存原因，本条到此结束</text>
  <text x="40" y="631" class="label">两个插入点</text>
  <text x="40" y="666" class="body">beforeRoute · 决定请求是否进入 Router</text>
  <text x="548" y="666" class="body">beforeNotify · 决定已保存的结果如何通知</text>
</svg>
